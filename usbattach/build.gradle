plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.github.kongduino.usbattach'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Kongduino'
                artifactId = 'XojoUsbAttach'
                version = '1.0.0'
            }
        }
    }
}
